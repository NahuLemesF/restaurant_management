spring.application.name=restaurant-management

# Database Configuration (Use environment variables in production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:restaurant}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}

# Server Configuration
server.servlet.context-path=/api/v1

# Business Rules Configuration
business.client.frequent-threshold=10
business.dish.popular-threshold=100
